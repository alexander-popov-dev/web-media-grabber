services:
  # Backend API (FastAPI + yt-dlp)
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: always
    env_file:
      - ../.env
    environment:
      # Never try browser cookie extraction inside the container: there is no
      # browser profile, and it would shadow the mounted cookie file.
      - YT_COOKIES_BROWSER=
      - YT_COOKIES_FILE=/app/cookies/cookies_youtube.txt
    volumes:
      - media:/app/media
      # Bind-mount local YouTube cookies (source file, read-only)
      - ../cookies/cookies_youtube.txt:/app/cookies/cookies_youtube.txt:ro
      # Note: normalized cookies and Playwright-extracted cookies are written
      # to /app/cookies/ in the container filesystem (no named volume needed)
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.media-grabber-backend.rule=Host(`${BACKEND_HOST}`)"
      - "traefik.http.routers.media-grabber-backend.tls.certresolver=le"
      - "traefik.http.services.media-grabber-backend.loadbalancer.server.port=${BACKEND_PORT}"

  # Frontend (static files served by backend)
  # Already served by backend via StaticFiles mount at "/"

volumes:
  media:

networks:
  traefik-public:
    external: true