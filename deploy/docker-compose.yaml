services:
  # Backend API (FastAPI + yt-dlp)
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: always
    env_file:
      - ../.env
    volumes:
      - media:/app/media
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`${BACKEND_HOST}`)"
      - "traefik.http.routers.backend.tls.certresolver=le"
      - "traefik.http.services.backend.loadbalancer.server.port=${BACKEND_PORT}"

  # Frontend (static files served by backend)
  # Already served by backend via StaticFiles mount at "/"

volumes:
  media:

networks:
  traefik-public:
    external: true